<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checking network status - Gemini</title>
    <script src="renderer.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Ubuntu, Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f3f2f1;
            color: #323130;
        }
        .container {
            text-align: center;
            padding: 20px;
            background: #f3f2f0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        h1 {
            font-size: 2em;
            color: #000000;
        }
        p {
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Checking Network Status...</h1>
        <p id="status-message">Please wait while we check your network connection.</p>
        <div id="login-container" style="display: none;">
            <p>You need to log in to Google to continue.</p>
            <button id="login-button">Open Login</button>
        </div>
    </div>
    <script>
        // Check network status and handle login
        window.onload = function() {
            // Simulate network check
            setTimeout(() => {
                const statusMessage = document.getElementById('status-message');
                const loginContainer = document.getElementById('login-container');
                
                // Show login button if we detect login is needed
                // This is a simplified check - in a real app, you'd check actual auth status
                statusMessage.textContent = 'Login required to access Gemini.';
                loginContainer.style.display = 'block';
                
                document.getElementById('login-button').addEventListener('click', () => {
                    window.openLogin();
                });
            }, 1000);
        };
    </script>
</body>
</html>
