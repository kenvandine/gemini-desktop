<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini - AI Chat</title>
    <script src="renderer.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Ubuntu, Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f3f2f1;
            color: #323130;
        }
        .container {
            text-align: center;
            padding: 20px;
            background: #f3f2f0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
        }
        h1 {
            font-size: 2em;
            color: #000000;
        }
        p {
            margin: 20px 0;
        }
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4285f4;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .credentials-dialog {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }
        .credentials-content {
            background: white;
            margin: 10% auto;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 400px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }
        .credentials-input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .credentials-button {
            background: #4285f4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        .credentials-button:hover {
            background: #3367d6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gemini - AI Chat</h1>
        <p>Loading Gemini application...</p>
        <div class="loading-spinner"></div>
        <p id="status-message"></p>
    </div>
    
    <!-- Credentials Dialog -->
    <div id="credentials-dialog" class="credentials-dialog">
        <div class="credentials-content">
            <h2>Save Credentials</h2>
            <input type="text" id="username" class="credentials-input" placeholder="Username">
            <input type="password" id="password" class="credentials-input" placeholder="Password">
            <button class="credentials-button" onclick="saveCredentials()">Save</button>
            <button class="credentials-button" onclick="closeCredentialsDialog()">Cancel</button>
        </div>
    </div>
    
    <script>
        // Wait for DOM to load
        document.addEventListener('DOMContentLoaded', () => {
            // Check if we have saved credentials
            checkSavedCredentials();
        });

        function checkSavedCredentials() {
            // Check if we have saved credentials
            window.electronAPI.getSavedCredentials().then(result => {
                if (result.success && result.credentials) {
                    // Use saved credentials
                    console.log('Using saved credentials');
                    // In a real implementation, we would pass these to the app
                } else {
                    // Show credentials dialog
                    showCredentialsDialog();
                }
            });
        }

        function showCredentialsDialog() {
            document.getElementById('credentials-dialog').style.display = 'block';
        }

        function closeCredentialsDialog() {
            document.getElementById('credentials-dialog').style.display = 'none';
        }

        function saveCredentials() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (username && password) {
                window.electronAPI.saveCredentials({ username, password }).then(result => {
                    if (result.success) {
                        console.log('Credentials saved successfully');
                        closeCredentialsDialog();
                        // Reload the app to use the saved credentials
                        window.location.reload();
                    } else {
                        console.error('Failed to save credentials:', result.error);
                    }
                });
            }
        }

        // Load the Gemini app
        window.electronAPI.loadGeminiApp();
    </script>
</body>
</html>
