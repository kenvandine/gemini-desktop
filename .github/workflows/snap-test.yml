# .github/workflows/snap-test.yml
#
# YARF snap testing workflow for this snap packaging repository.
#
# This workflow lives in the snap's own packaging repository at:
#   .github/workflows/snap-test.yml
#
# Colocated YARF test suites should live at:
#   tests/suite/   (with __init__.robot and individual test files)
#
# Test results (screenshots, metadata) are stored as GitHub Actions artifacts
# and fetched directly by the automated-ken dashboard after the run completes.
# No branch or PR creation is needed.
#
# Optional secrets:
#   SNAPCRAFT_STORE_CREDENTIALS  - If you need store-authenticated snap installs.

name: YARF Snap Test

on:
  workflow_dispatch:
    inputs:
      snap_name:
        description: "Snap name to test"
        required: true
        type: string
      from_channel:
        description: "Channel to install from (candidate/edge)"
        required: true
        default: candidate
        type: string
      architecture:
        description: "Architecture to test (amd64, arm64)"
        required: true
        default: amd64
        type: string
      version:
        description: "Expected snap version (informational)"
        required: false
        type: string
      revision:
        description: "Expected snap revision (informational)"
        required: false
        type: string
      dashboard_run_id:
        description: "snap-dashboard TestRun ID (for correlation)"
        required: false
        type: string

jobs:
  yarf-test:
    name: "YARF — ${{ inputs.snap_name }} ${{ inputs.architecture }} from ${{ inputs.from_channel }}"
    runs-on: "${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}"

    steps:
      - name: Checkout testing repo
        uses: actions/checkout@v4

      - name: Install snaps
        env:
          SNAP_NAME: ${{ inputs.snap_name }}
        run: |
          sudo apt-get install -y inotify-tools python3-pil libgl1-mesa-dri dbus-user-session foot
          sudo snap install --beta yarf
          sudo snap install mir-test-tools
          sudo snap install "$SNAP_NAME" --channel "${{ inputs.from_channel }}"
          sudo snap connect yarf:process-control
          sudo snap connect "$SNAP_NAME":wayland || true
          sudo snap connect "$SNAP_NAME":opengl || true
          echo "=== Snap connections for $SNAP_NAME ==="
          snap connections "$SNAP_NAME" || true

          # Capture actual installed version and revision
          SNAP_LIST=$(snap list "$SNAP_NAME" --unicode=never | tail -1)
          ACTUAL_VERSION=$(echo "$SNAP_LIST" | awk '{print $2}')
          ACTUAL_REVISION=$(echo "$SNAP_LIST" | awk '{print $3}')
          echo "ACTUAL_VERSION=${ACTUAL_VERSION}" >> "$GITHUB_ENV"
          echo "ACTUAL_REVISION=${ACTUAL_REVISION}" >> "$GITHUB_ENV"

      - name: Inspect snap launcher
        env:
          SNAP_NAME: ${{ inputs.snap_name }}
        run: |
          SNAP_DIR="/snap/$SNAP_NAME/current"
          echo "=== command-chain dir ==="
          ls -la "$SNAP_DIR/snap/command-chain/" 2>/dev/null || true
          for f in "$SNAP_DIR/snap/command-chain/"*; do
            [ -f "$f" ] || continue
            echo "--- $f ($(file -b "$f")) ---"
            head -80 "$f" 2>/dev/null || true
            echo ""
          done
          echo "=== launcher (top-level) ==="
          for path in "$SNAP_DIR/launcher" "$SNAP_DIR/bin/launcher" "$SNAP_DIR/usr/bin/launcher"; do
            [ -f "$path" ] || continue
            echo "--- $path ($(file -b "$path")) ---"
            head -80 "$path" 2>/dev/null || true
            echo ""
          done
          echo "=== content snap chain scripts ==="
          for path in \
            "$SNAP_DIR/gnome-platform/command-chain/desktop-launch" \
            "$SNAP_DIR/gpu-2404/bin/gpu-2404-provider-wrapper"; do
            [ -f "$path" ] || continue
            echo "--- $path ($(file -b "$path")) ---"
            cat "$path" 2>/dev/null | tail -40 || true
            echo ""
          done

      - name: Start Mir compositor
        run: |
          export WAYLAND_DISPLAY=wayland-99
          mir-test-tools.demo-server \
            --add-wayland-extensions zwlr_screencopy_manager_v1:zwlr_virtual_pointer_manager_v1 \
            --platform-display-libs mir:virtual \
            --virtual-output 1920x1080 \
            --cursor null \
            --display-scale 1.0 \
            --cursor-scale 1 &
          inotifywait --event create \
            --include "^$XDG_RUNTIME_DIR/wayland-99\$" \
            "$XDG_RUNTIME_DIR"
          echo "WAYLAND_DISPLAY=wayland-99" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          echo "GALLIUM_DRIVER=llvmpipe" >> "$GITHUB_ENV"

      - name: Start user session
        run: |
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
          sudo loginctl enable-linger "$(id -un)" || true
          sudo systemctl start "user@$(id -u).service"
          export XDG_RUNTIME_DIR
          export DBUS_SESSION_BUS_ADDRESS
          systemctl --user start dbus.socket || true
          timeout 30 bash -c "until [ -S '${XDG_RUNTIME_DIR}/bus' ]; do sleep 1; done"
          echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS}" >> "$GITHUB_ENV"

      - name: Start snap under test
        env:
          SNAP_NAME: ${{ inputs.snap_name }}
        run: |
          env \
            XDG_SESSION_TYPE=wayland \
            OZONE_PLATFORM=wayland \
            ELECTRON_OZONE_PLATFORM_HINT=wayland \
            XCURSOR_SIZE=24 \
            GDK_SCALE=1 \
            GDK_DPI_SCALE=1 \
            snap run "$SNAP_NAME" > /tmp/snap-stdout.log 2> /tmp/snap-stderr.log &
          # Wait for the snap process to appear, then give it time to render
          timeout 30 bash -c \
            "until pgrep -f '/snap/${SNAP_NAME}/' > /dev/null; do sleep 1; done"
          sleep 15

      - name: Debug display state
        env:
          SNAP_NAME: ${{ inputs.snap_name }}
        run: |
          echo "=== Wayland compositor socket ==="
          ls -la "$XDG_RUNTIME_DIR"/wayland-* 2>&1 || true
          echo "=== Running snap processes ==="
          pgrep -a -f "/snap/${SNAP_NAME}/" 2>&1 || true
          echo "=== Session D-Bus ==="
          printf 'XDG_RUNTIME_DIR=%s\n' "${XDG_RUNTIME_DIR:-<unset>}"
          printf 'DBUS_SESSION_BUS_ADDRESS=%s\n' "${DBUS_SESSION_BUS_ADDRESS:-<unset>}"
          systemctl --user status dbus.socket --no-pager 2>&1 || true
          echo "=== Snap stdout ==="
          cat /tmp/snap-stdout.log 2>/dev/null || true
          echo "=== Snap stderr ==="
          cat /tmp/snap-stderr.log 2>/dev/null || true

      - name: Verify snap stayed alive
        id: app_health
        continue-on-error: true
        env:
          SNAP_NAME: ${{ inputs.snap_name }}
        run: |
          if pgrep -a -f "/snap/${SNAP_NAME}/" > /tmp/snap-processes.log; then
            cat /tmp/snap-processes.log
            echo "alive=true" >> "$GITHUB_OUTPUT"
          else
            echo "No running /snap/${SNAP_NAME}/ process found after render wait." >&2
            echo "alive=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Run YARF tests
        id: yarf
        continue-on-error: true
        run: |
          mkdir -p "results/${{ inputs.snap_name }}"
          set +e
          yarf \
            --platform Mir \
            --outdir "results/${{ inputs.snap_name }}" \
            "tests/suite"
          YARF_EXIT=$?
          set -e
          echo "yarf_exit=${YARF_EXIT}" >> "$GITHUB_OUTPUT"

      - name: Extract and validate screenshots
        id: screenshots
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import re, base64, zlib, os, sys, io
          from PIL import Image, ImageStat

          def set_output(name, value):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write(f"{name}={value}\n")

          snap = "${{ inputs.snap_name }}"
          html_file = f"results/{snap}/log.html"
          if not os.path.exists(html_file):
              print("No log.html found, skipping")
              set_output("count", "0")
              set_output("valid", "false")
              sys.exit(0)
          content = open(html_file, "rb").read().decode("utf-8", errors="replace")
          # YARF stores log messages as zlib-compressed base64 blobs in its JS output.
          # Each blob decodes to HTML containing data:image/png;base64,... URIs.
          # Blobs starting with "eN" are zlib-compressed (magic bytes 0x78 0xDA in base64).
          blobs = re.findall(r'"(eN[A-Za-z0-9+/=]+)"', content)
          screenshots = []
          failures = []
          for blob in blobs:
              try:
                  decompressed = zlib.decompress(base64.b64decode(blob)).decode("utf-8", errors="replace")
                  pngs = re.findall(r'data:image/png;base64,([A-Za-z0-9+/=]+)', decompressed)
                  screenshots.extend(pngs)
              except Exception:
                  pass
          if not screenshots:
              print("No screenshots found in YARF log")
              set_output("count", "0")
              set_output("valid", "false")
              sys.exit(1)
          for i, png_b64 in enumerate(screenshots):
              path = f"results/{snap}/screenshot-{i+1:03d}.png"
              img = Image.open(io.BytesIO(base64.b64decode(png_b64)))
              brightness = sum(ImageStat.Stat(img.convert("RGB")).mean) / 3
              if brightness < 8:
                  failures.append(f"{path} is effectively black (mean brightness {brightness:.2f})")
              # Crop out the black Mir desktop background, keeping only the app window
              bbox = img.convert("RGB").getbbox()
              if bbox:
                  img = img.crop(bbox)
              img.save(path)
              print(f"Extracted {path}")
          set_output("count", str(len(screenshots)))
          set_output("valid", "false" if failures else "true")
          for failure in failures:
              print(failure)
          print(f"Total: {len(screenshots)} screenshot(s)")
          if failures:
              sys.exit(1)
          EOF

      - name: Determine test status
        id: status
        run: |
          EXIT="${{ steps.yarf.outputs.yarf_exit }}"
          APP_ALIVE="${{ steps.app_health.outputs.alive }}"
          SCREENSHOT_VALID="${{ steps.screenshots.outputs.valid }}"
          # Terminal apps (started by YARF via foot) exit before the pre-YARF alive
          # check runs, so APP_ALIVE may be false even when the test succeeds.
          # YARF exit code + valid screenshot is the authoritative pass signal.
          if [ "$EXIT" = "0" ] && [ "$SCREENSHOT_VALID" = "true" ]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Write summary metadata
        run: |
          cat > "results/${{ inputs.snap_name }}/summary.txt" <<EOF
          snap: ${{ inputs.snap_name }}
          version: ${{ inputs.version }}
          actual_version: ${ACTUAL_VERSION}
          channel: ${{ inputs.from_channel }}
          revision: ${{ inputs.revision }}
          actual_revision: ${ACTUAL_REVISION}
          architecture: ${{ inputs.architecture }}
          status: ${{ steps.status.outputs.status }}
          gh_run_id: ${{ github.run_id }}
          dashboard_run_id: ${{ inputs.dashboard_run_id }}
          yarf_exit_code: ${{ steps.yarf.outputs.yarf_exit }}
          app_alive_after_wait: ${{ steps.app_health.outputs.alive }}
          screenshot_count: ${{ steps.screenshots.outputs.count }}
          screenshot_valid: ${{ steps.screenshots.outputs.valid }}
          EOF

      - name: Collect snap logs
        run: |
          cp /tmp/snap-stdout.log "results/${{ inputs.snap_name }}/snap-stdout.log" 2>/dev/null || true
          cp /tmp/snap-stderr.log "results/${{ inputs.snap_name }}/snap-stderr.log" 2>/dev/null || true

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "yarf-results-${{ inputs.snap_name }}-${{ github.run_id }}"
          path: "results/${{ inputs.snap_name }}"
          if-no-files-found: warn

      - name: Summary
        run: |
          STATUS="${{ steps.status.outputs.status }}"
          SNAP="${{ inputs.snap_name }}"
          if [ "$STATUS" = "passed" ]; then
            echo "## ✅ Tests passed for ${SNAP}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ Tests failed for ${SNAP}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Snap | \`${SNAP}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Installed version | \`${ACTUAL_VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Installed revision | \`${ACTUAL_REVISION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Channel | \`${{ inputs.from_channel }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Architecture | \`${{ inputs.architecture }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| YARF exit code | \`${{ steps.yarf.outputs.yarf_exit }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dashboard run ID | \`${{ inputs.dashboard_run_id }}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail workflow on test failure
        if: steps.status.outputs.status != 'passed'
        run: exit 1
